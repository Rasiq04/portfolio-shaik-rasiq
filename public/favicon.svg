<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="bgFav" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Glow Border -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#bgFav)" stroke="url(#favGrad)" stroke-width="4" />
  
  <!-- Code Brackets & SR Monogram -->
  <text x="50" y="62" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="900" font-size="44" fill="url(#favGrad)" text-anchor="middle" letter-spacing="-2" filter="url(#glow)">SR</text>

  <!-- Accent Code Dot -->
  <circle cx="78" cy="24" r="5" fill="#00f2fe" />
</svg>
