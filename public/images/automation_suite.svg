  <text x="150" y="320" fill="#a855f7" font-family="monospace" font-size="12">✓ REST API JSON endpoint fetched &amp; normalized to MySQL.</text>
  <text x="150" y="345" fill="#f59e0b" font-family="monospace" font-size="12">✓ Task Automation efficiency boost: +85% time savings.</text>
