  <rect x="100" y="40" width="600" height="370" rx="16" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <rect x="100" y="40" width="600" height="35" rx="16" fill="#1e293b"/>
  <circle cx="125" cy="57" r="5" fill="#ef4444"/>
  <circle cx="140" cy="57" r="5" fill="#f59e0b"/>
